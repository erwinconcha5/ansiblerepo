---

- hosts: all
  become: true 
  pre_tasks:

    - name: install updates (Rocky)
      dnf:
        update_only: yes
        update_cache: yes
      when: ansible_distribution == "Rocky"

    - name: install updates (Ubuntu)
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_distribution == "Ubuntu"

- hosts: web_servers
  become: true
  tasks:

    - name: update php httpd mariadb for apache
      dnf: 
        name:
          - php
          - httpd
          - mariadb-server
        state: latest
      when: ansible_distribution == "Rocky"  

    - name: add php support for apache
      apt:
        name:
          - libapache2-mod-php
          - apache2  
        state: latest
      when: ansible_distribution == "Ubuntu"
     
- hosts: db_servers
  become: true
  tasks:
    
    - name: install mariadb package (Ubuntu)
      apt:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "Ubuntu"


