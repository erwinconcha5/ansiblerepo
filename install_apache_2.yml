---

- hosts: all
  become: true 
  tasks:

    - name: update php support for apache
      dnf: 
        name:
          - php
          - httpd
        state: latest
        update_cache: yes
      when: ansible_distribution == "Rocky"  

    - name: add php support for apache
      apt:
        name:
          - libapache2-mod-php
          - apache2  
        state: latest
        update_cache: yes
      when: ansible_distribution == "Ubuntu"
          
