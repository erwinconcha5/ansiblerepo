---

- hosts: all
  become: true 
  pre_tasks:

    - name: update repo cache (Rocky)
      tags: always
      dnf:
        update_cache: yes
      changed_when: false
      when: ansible_distribution == "Rocky"

    - name: update repo cache (Ubuntu)
      tags: always
      apt:
        update_cache: yes
      changed_when: false  
      when: ansible_distribution == "Ubuntu"

- hosts: all
  become: true
  tasks:

    - name: add ssh key for simone
      tags: always
      authorized_key:
        user: simone
        key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAKnhPV4TyRcuMX4OMnQcpcwUsOB9rpdlLkUJUcYEDeb ansible test"

- hosts: web_servers
  become: true
  tasks:

    - name: update php httpd mariadb for apache
      tags: apache,httpd,Rocky
      dnf: 
        name:
          - php
          - httpd
          - mariadb-server
        state: latest
      when: ansible_distribution == "Rocky"  
    
    - name: start httpd (Rocky)
      tags: apache,Rocky,httpd
      service:
        name: httpd
        state: started
        enabled: yes
      when: ansible_distribution == "Rocky"

    - name: change e-mail address for admin
      tags: apache,Rocky,httpd
      lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^ServerAdmin'
        line: ServerAdmin somebody@somewhere.net
      when: ansible_distribution == "Rocky"
      register: httpd

    - name: restart httpd (Rocky)
      tags: apache,Rocky,httpd
      service: 
        name: httpd
        state: restarted
      when: httpd.changed  

    - name: add php support for apache
      tags: apache,apache2,ubuntu
      apt:
        name:
          - libapache2-mod-php
          - apache2  
        state: latest
      when: ansible_distribution == "Ubuntu"

    - name: copy default html file for site
      tags: apache,apache2,httpd
      copy:
        src: default_site.html
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644 
     
- hosts: db_servers
  become: true
  tasks:
    
    - name: install mariadb package (Ubuntu)
      tags: db,Ubuntu,db
      apt:
        name: mariadb-server
        state: latest
      when: ansible_distribution == "Ubuntu"

    - name: install unzip
      package:
        name: unzip

    - name: install terraform
      unarchive:
        src: https://releases.hashicorp.com/terraform/1.14.0/terraform_1.14.0_linux_amd64.zip 
        dest: /usr/local/bin
        remote_src: yes
        mode: 0755
        owner: root
        group: root
       

